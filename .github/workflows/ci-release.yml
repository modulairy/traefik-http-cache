name: Validate and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert native runner architecture
        env:
          EXPECTED: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format, race tests and vet
        run: |
          test -z "$(gofmt -l .)"
          go test -race -count=1 ./...
          go vet ./...
      - name: Build and start real integration stack
        run: docker compose -f infra/compose.yml up -d --build
      - name: Wait for both routers
        run: |
          for host in memory.localhost redis.localhost; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 2 -H "Host: $host" http://localhost:18080/public >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
          done
      - name: Real Redis and Traefik / Yaegi tests
        run: docker compose -f infra/compose.yml --profile test run --rm test
      - name: Integration logs
        if: failure()
        run: docker compose -f infra/compose.yml logs --no-color
      - name: Stop integration stack
        if: always()
        run: docker compose -f infra/compose.yml down --volumes --remove-orphans

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image_tag: ${{ steps.versions.outputs.image_tag }}
      traefik_version: ${{ steps.versions.outputs.traefik_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "const Version = \"${TAG#v}\"" http_cache.go
      - name: Derive image version from pinned Traefik base
        id: versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base=$(sed -n 's/^ARG TRAEFIK_VERSION=//p' container/Dockerfile)
          [[ "$base" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)@sha256:[a-f0-9]{64}$ ]]
          traefik_version="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          image_tag="${TAG}-traefik-v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          echo "traefik_version=$traefik_version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish bundled Traefik image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/modulairy/traefik-http-cache:${{ steps.versions.outputs.image_tag }}
          labels: |
            io.traefik.version=${{ steps.versions.outputs.traefik_version }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

  verify-published:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            machine: aarch64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: infra/compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert native runner architecture
        env:
          EXPECTED: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select exact published image digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'services:\n  traefik:\n    image: ghcr.io/modulairy/traefik-http-cache@%s\n' "$DIGEST" > "$RUNNER_TEMP/published-image.yml"
          echo "COMPOSE_FILE=infra/compose.yml:$RUNNER_TEMP/published-image.yml" >> "$GITHUB_ENV"
      - name: Build fixture and pull published image
        run: |
          docker compose build backend
          docker compose --profile test pull traefik redis test
          docker compose up -d --no-build
      - name: Verify container architecture
        env:
          EXPECTED: ${{ matrix.machine }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          test "$(docker compose exec -T traefik uname -m)" = "$EXPECTED"
          container=$(docker compose ps -q traefik)
          image=$(docker inspect --format '{{.Image}}' "$container")
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$EXPECTED_ARCH"
      - name: Wait for both routers
        run: |
          for host in memory.localhost redis.localhost; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 2 -H "Host: $host" http://localhost:18080/public >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
          done
      - name: Published image Redis and Traefik integration with race tests
        run: docker compose --profile test run --rm --no-deps test
      - name: Integration logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop published integration stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [publish, verify-published]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          TRAEFIK_VERSION: ${{ needs.publish.outputs.traefik_version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          printf 'Container: `ghcr.io/modulairy/traefik-http-cache:%s`\n\nBundled Traefik: `%s`\n\nDigest: `%s`\n\nArchitectures: `linux/amd64`, `linux/arm64`. Both published variants passed native integration and race tests.\n\nThis image bundles Traefik and the local HTTP cache plugin. The source/plugin Git tag remains unchanged. See README and docs/design.md for configuration and limits.\n' "$IMAGE_TAG" "$TRAEFIK_VERSION" "$DIGEST" > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
