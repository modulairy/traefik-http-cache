name: Validate and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format, race tests and vet
        run: |
          test -z "$(gofmt -l .)"
          go test -race -count=1 ./...
          go vet ./...
      - name: Build and start real integration stack
        run: docker compose -f infra/compose.yml up -d --build
      - name: Wait for both routers
        run: |
          for host in memory.localhost redis.localhost; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 2 -H "Host: $host" http://localhost:18080/public >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
          done
      - name: Real Redis and Traefik / Yaegi tests
        run: docker compose -f infra/compose.yml --profile test run --rm test
      - name: Integration logs
        if: failure()
        run: docker compose -f infra/compose.yml logs --no-color
      - name: Stop integration stack
        if: always()
        run: docker compose -f infra/compose.yml down --volumes --remove-orphans

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "const Version = \"${TAG#v}\"" http_cache.go
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish bundled Traefik image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/modulairy/traefik-http-cache:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Container: `ghcr.io/modulairy/traefik-http-cache:%s`\n\nDigest: `%s`\n\nThis image bundles Traefik and the local HTTP cache plugin. See README and docs/design.md for configuration and limits.\n' "$TAG" "$DIGEST" > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
