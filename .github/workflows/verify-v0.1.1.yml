name: Verify existing v0.1.1 image

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-v0.1.1.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-existing-v0.1.1
  cancel-in-progress: false

env:
  RELEASE_COMMIT: b58c8537daa46c25e99869f434e5c9ab2bf0668b
  IMAGE_DIGEST: sha256:f43025021a1645d29b3c903dc996d6f9b3bbf3baa5e09eca8ffbf825a7fb3fd2
  IMAGE_TAG: v0.1.1-traefik-v3.7
  IMAGE_REPO: ghcr.io/modulairy/traefik-http-cache

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            machine: aarch64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: infra/compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b58c8537daa46c25e99869f434e5c9ab2bf0668b
      - name: Assert source and native architecture
        env:
          EXPECTED: ${{ matrix.machine }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(uname -m)" = "$EXPECTED"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select existing immutable image
        run: |
          printf 'services:\n  traefik:\n    image: %s@%s\n' "$IMAGE_REPO" "$IMAGE_DIGEST" > "$RUNNER_TEMP/published-image.yml"
          echo "COMPOSE_FILE=infra/compose.yml:$RUNNER_TEMP/published-image.yml" >> "$GITHUB_ENV"
      - name: Build fixture and pull existing image
        run: |
          docker compose build backend
          docker compose --profile test pull traefik redis test
          docker compose up -d --no-build
      - name: Verify container architecture
        env:
          EXPECTED: ${{ matrix.machine }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          test "$(docker compose exec -T traefik uname -m)" = "$EXPECTED"
          container=$(docker compose ps -q traefik)
          image=$(docker inspect --format '{{.Image}}' "$container")
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$EXPECTED_ARCH"
      - name: Wait for both routers
        run: |
          for host in memory.localhost redis.localhost; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 2 -H "Host: $host" http://localhost:18080/public >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
          done
      - name: Published image Redis and Traefik integration with race tests
        run: docker compose --profile test run --rm --no-deps test
      - name: Integration logs
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b58c8537daa46c25e99869f434e5c9ab2bf0668b
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify unchanged source tag and image digest
        run: |
          git fetch --no-tags origin refs/tags/v0.1.1
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_COMMIT"
          digest=$(docker buildx imagetools inspect "$IMAGE_REPO:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          test "$digest" = "$IMAGE_DIGEST"
      - name: Create verified v0.1.1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'Container: `%s:%s`\n\nBundled Traefik: `v3.7.16`\n\nDigest: `%s`\n\nArchitectures: `linux/amd64`, `linux/arm64`. Both existing published variants passed native integration and race tests in the recovery workflow.\n\nSource commit: `%s`. No source or image tag was moved and the published image was not rebuilt.\n' "$IMAGE_REPO" "$IMAGE_TAG" "$IMAGE_DIGEST" "$RELEASE_COMMIT" > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view v0.1.1 >/dev/null 2>&1; then
            gh release create v0.1.1 --verify-tag --title v0.1.1 --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
