apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-catalog-cache@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: catalog.example.com
      http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: catalog
                port:
                  number: 8080
