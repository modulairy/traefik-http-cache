apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog
  namespace: apps
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: apps
  hostnames: [catalog.example.com]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/products
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: catalog-cache
      backendRefs:
        - name: catalog
          port: 8080
