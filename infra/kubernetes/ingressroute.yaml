apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalog
  namespace: apps
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`catalog.example.com`) && PathPrefix(`/api/products`)
      middlewares:
        - name: catalog-cache
      services:
        - name: catalog
          port: 8080
