displayName: HTTP Cache
type: middleware
import: github.com/modulairy/traefik-http-cache
summary: HTTP response caching by Modulairy. Redis and memory stores, precise cache rules, and conditional revalidation for Traefik.
iconPath: .assets/icon.png
bannerPath: .assets/banner.png
testData:
  keyPrefix: catalog-test
  store:
    type: memory
    memory:
      maxEntries: 100
      maxBytes: 1048576
  rules:
    - name: public
      request:
        path:
          type: prefix
          value: /
      cache:
        ttl: 60s
        retention: 10m
